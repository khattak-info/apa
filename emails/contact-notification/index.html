<!DOCTYPE html>
<html>
<body style="font-family: sans-serif; color: #1f2937; max-width: 600px; margin: 0 auto;">
  <div style="background: #15803d; color: white; padding: 24px; border-radius: 8px 8px 0 0;">
    <h1 style="margin: 0; font-size: 20px;">New Contact Form Submission</h1>
  </div>
  <div style="border: 1px solid #e5e7eb; border-top: none; padding: 24px; border-radius: 0 0 8px 8px;">
    <p><strong>From:</strong> {{name}} ({{email}})</p>
    <p><strong>Regarding:</strong> {{subject}}</p>
    <p><strong>Message:</strong></p>
    <p style="background: #f9fafb; padding: 16px; border-radius: 6px; white-space: pre-wrap;">{{message}}</p>
    <p style="color: #6b7280; font-size: 13px; margin-top: 24px;">Submitted via the APA website contact form. Reply directly to this email to respond to {{name}}.</p>
  </div>
</body>
</html>
